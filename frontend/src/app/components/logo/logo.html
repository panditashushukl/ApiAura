<div class="inline-flex items-center gap-2.5 select-none">
  @if (withBadge()) {
    <div
      class="flex items-center justify-center font-bold transition-all shadow-xs shrink-0 bg-bhagwa-500/10 border border-bhagwa-500/25 text-bhagwa-600 dark:text-bhagwa-400"
      [class.w-7]="size() === 'sm'"
      [class.h-7]="size() === 'sm'"
      [class.rounded-lg]="size() === 'sm'"
      [class.w-9]="size() === 'md'"
      [class.h-9]="size() === 'md'"
      [class.rounded-xl]="size() === 'md'"
      [class.w-12]="size() === 'lg'"
      [class.h-12]="size() === 'lg'"
      [class.rounded-2xl]="size() === 'lg'"
      [class.w-16]="size() === 'xl'"
      [class.h-16]="size() === 'xl'"
      [class.rounded-3xl]="size() === 'xl'"
    >
      <svg
        viewBox="0 0 24 24"
        fill="currentColor"
        [class.w-4]="size() === 'sm'"
        [class.h-4]="size() === 'sm'"
        [class.w-5]="size() === 'md'"
        [class.h-5]="size() === 'md'"
        [class.w-6]="size() === 'lg'"
        [class.h-6]="size() === 'lg'"
        [class.w-8]="size() === 'xl'"
        [class.h-8]="size() === 'xl'"
        class="text-bhagwa-600 dark:text-bhagwa-400"
        aria-hidden="true"
      >
        <!-- Branded Fire / Flame Symbol -->
        <path
          fill-rule="evenodd"
          d="M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.177 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248ZM15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1a5.99 5.99 0 0 1 1.925-3.546 3.75 3.75 0 0 1 3.255 3.718Z"
          clip-rule="evenodd"
        />
      </svg>
    </div>
  } @else {
    <svg
      viewBox="0 0 24 24"
      fill="currentColor"
      [class.w-4]="size() === 'sm'"
      [class.h-4]="size() === 'sm'"
      [class.w-5]="size() === 'md'"
      [class.h-5]="size() === 'md'"
      [class.w-6]="size() === 'lg'"
      [class.h-6]="size() === 'lg'"
      [class.w-8]="size() === 'xl'"
      [class.h-8]="size() === 'xl'"
      class="text-bhagwa-600 dark:text-bhagwa-400 shrink-0"
      aria-hidden="true"
    >
      <!-- Branded Fire / Flame Symbol -->
      <path
        fill-rule="evenodd"
        d="M12.963 2.286a.75.75 0 0 0-1.071-.136 9.742 9.742 0 0 0-3.539 6.177 7.547 7.547 0 0 1-1.705-1.715.75.75 0 0 0-1.152-.082A9 9 0 1 0 15.68 4.534a7.46 7.46 0 0 1-2.717-2.248ZM15.75 14.25a3.75 3.75 0 1 1-7.313-1.172c.628.465 1.35.81 2.133 1a5.99 5.99 0 0 1 1.925-3.546 3.75 3.75 0 0 1 3.255 3.718Z"
        clip-rule="evenodd"
      />
    </svg>
  }

  @if (showText()) {
    <span
      class="font-bold tracking-tight text-text-main"
      [class.text-sm]="textSize() === 'sm'"
      [class.text-base]="textSize() === 'base'"
      [class.text-lg]="textSize() === 'lg'"
      [class.text-xl]="textSize() === 'xl'"
    >
      Api<span class="text-bhagwa-600 dark:text-bhagwa-400">Aura</span>
    </span>
  }
</div>
