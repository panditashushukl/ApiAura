<div class="flex-1 overflow-x-auto">
  <table mat-table [dataSource]="dataSource()" matSort class="w-full">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Organisation</th>
      <td mat-cell *matCellDef="let org">
        <div class="flex items-center gap-2.5 py-1">
          <div class="w-7 h-7 rounded-lg bg-bhagwa-500/15 text-bhagwa font-bold text-xs flex items-center justify-center shrink-0 border border-bhagwa-500/20">
            {{ org.name?.charAt(0) || 'O' }}
          </div>
          <div class="min-w-0">
            <p class="font-semibold text-main text-xs truncate">{{ org.name }}</p>
          </div>
        </div>
      </td>
    </ng-container>

    <!-- Slug Column -->
    <ng-container matColumnDef="slug">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Identifier</th>
      <td mat-cell *matCellDef="let org">
        <span class="font-mono text-xs text-secondary font-medium px-2 py-0.5 rounded-md bg-subtle border border-app">
          {{ org.slug }}
        </span>
      </td>
    </ng-container>

    <!-- Admin Column -->
    <ng-container matColumnDef="admin">
      <th mat-header-cell *matHeaderCellDef>Administrator</th>
      <td mat-cell *matCellDef="let org">
        @if (getAdmin(org); as admin) {
          <div class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            <span class="text-xs font-medium text-main truncate max-w-[150px]">{{ admin.name }}</span>
          </div>
        } @else {
          <span class="text-muted text-[11px] italic">Unassigned</span>
        }
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="text-right">Actions</th>
      <td mat-cell *matCellDef="let org" class="text-right whitespace-nowrap">
        <div class="inline-flex items-center gap-1">
          <!-- View Details -->
          <button
            type="button"
            (click)="viewDetails.emit(org)"
            title="View Details"
            class="p-1.5 rounded-lg text-secondary hover:text-bhagwa hover:bg-bhagwa-500/10 transition-colors cursor-pointer"
            [attr.id]="'btn-view-org-' + org.id"
          >
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>

          <!-- Edit Org -->
          <button
            type="button"
            (click)="editOrg.emit(org)"
            title="Edit Organisation"
            class="p-1.5 rounded-lg text-secondary hover:text-main hover:bg-subtle transition-colors cursor-pointer"
          >
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
          </button>

          <!-- Delete Org -->
          <button
            type="button"
            (click)="deleteOrg.emit(org)"
            title="Delete Organisation"
            class="p-1.5 rounded-lg text-secondary hover:text-rose-600 hover:bg-rose-500/10 transition-colors cursor-pointer"
          >
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns();" class="hover:bg-subtle/50 transition-colors"></tr>
  </table>
</div>
<mat-paginator
  [pageSizeOptions]="[10, 25, 50]"
  showFirstLastButtons
  class="border-t border-app"
></mat-paginator>
