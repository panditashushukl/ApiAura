<div class="flex-1 overflow-x-auto">
  <table mat-table [dataSource]="dataSource()" matSort class="w-full">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Permission</th>
      <td mat-cell *matCellDef="let perm">
        <div class="py-1">
          <p class="font-semibold text-main text-xs">{{ perm.name }}</p>
          @if (perm.description) {
            <p class="text-[11px] text-muted truncate max-w-xs">{{ perm.description }}</p>
          }
        </div>
      </td>
    </ng-container>

    <!-- Code Column -->
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Code</th>
      <td mat-cell *matCellDef="let perm">
        <span class="font-mono text-xs text-secondary font-medium px-2 py-0.5 rounded-md bg-subtle border border-app">
          {{ perm.code }}
        </span>
      </td>
    </ng-container>

    <!-- Resource Column -->
    <ng-container matColumnDef="resource">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Resource</th>
      <td mat-cell *matCellDef="let perm">
        <span class="font-mono text-[11px] font-bold uppercase text-bhagwa px-2 py-0.5 rounded-md bg-bhagwa-500/10 border border-bhagwa-500/20">
          {{ perm.resource }}
        </span>
      </td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Action</th>
      <td mat-cell *matCellDef="let perm">
        <span class="font-mono text-[11px] font-bold uppercase text-emerald-600 dark:text-emerald-400 px-2 py-0.5 rounded-md bg-emerald-500/10 border border-emerald-500/20">
          {{ perm.action }}
        </span>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="text-right">Actions</th>
      <td mat-cell *matCellDef="let perm" class="text-right whitespace-nowrap">
        <div class="inline-flex items-center gap-1">
          <button
            type="button"
            (click)="viewDetails.emit(perm)"
            title="View Details"
            class="p-1.5 rounded-lg text-secondary hover:text-bhagwa hover:bg-bhagwa-500/10 transition-colors cursor-pointer"
            [attr.id]="'btn-view-perm-' + perm.id"
          >
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns();" class="hover:bg-subtle/50 transition-colors"></tr>
  </table>
</div>
<mat-paginator
  [pageSizeOptions]="[10, 25, 50]"
  showFirstLastButtons
  class="border-t border-app"
></mat-paginator>
