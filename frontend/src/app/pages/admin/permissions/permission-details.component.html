<div class="space-y-6">
  <!-- Top Navigation -->
  <div class="flex items-center justify-between pb-4 border-b border-app">
    <div class="flex items-center gap-3">
      <button
        type="button"
        id="btn-close-details-panel"
        (click)="close.emit()"
        class="p-2 rounded-xl text-secondary hover:text-main hover:bg-subtle border border-app transition-all cursor-pointer flex items-center gap-1.5 text-xs font-semibold"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        <span>Back to List</span>
      </button>
      <div>
        <h2 class="text-sm font-bold text-main uppercase tracking-wider">PERMISSION Details</h2>
        <p class="text-xs text-muted">Atomic system authorization definition and scope.</p>
      </div>
    </div>
    <span class="px-2.5 py-1 rounded text-xs font-mono font-bold uppercase bg-bhagwa-500/10 text-bhagwa border border-bhagwa-500/20">
      {{ permission().code }}
    </span>
  </div>

  <!-- Hero Card -->
  <div class="p-6 bg-surface border border-app rounded-2xl shadow-xs">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-lg font-bold text-main">{{ permission().name }}</h1>
        <p class="text-xs text-secondary mt-1.5 max-w-xl leading-relaxed">
          {{ permission().description || 'No description provided.' }}
        </p>
        <div class="flex items-center gap-2 mt-3">
          <span class="text-[11px] font-mono text-muted bg-subtle px-2 py-0.5 rounded border border-app">
            ID: {{ permission().id }}
          </span>
          <button
            type="button"
            (click)="copyId.emit(permission().id)"
            class="text-xs text-bhagwa hover:underline cursor-pointer flex items-center gap-1"
          >
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <span>{{ copiedId() ? 'Copied!' : 'Copy' }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Metadata Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="p-5 bg-surface border border-app rounded-2xl shadow-xs">
      <span class="text-muted text-[10px] uppercase font-bold tracking-wider block mb-1">Target Resource</span>
      <span class="text-sm font-bold font-mono text-bhagwa">{{ permission().resource }}</span>
    </div>
    <div class="p-5 bg-surface border border-app rounded-2xl shadow-xs">
      <span class="text-muted text-[10px] uppercase font-bold tracking-wider block mb-1">Allowed Action</span>
      <span class="text-sm font-bold font-mono text-emerald-600 dark:text-emerald-400">{{ permission().action }}</span>
    </div>
  </div>
</div>
