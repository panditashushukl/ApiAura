<div class="h-full flex-1 flex flex-col p-4 sm:p-6 bg-app overflow-y-auto min-h-0">
  @if (!showDetailsView()) {
    <!-- Controls Bar -->
    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3 mb-4">
      <!-- Switchable Slice Tabs -->
      <div class="inline-flex items-center p-1 bg-subtle border border-app rounded-xl shrink-0" role="tablist">
        <!-- Users Tab -->
        <button
          type="button"
          id="tab-slice-users"
          (click)="activeSlice.set('users')"
          role="tab"
          [attr.aria-selected]="activeSlice() === 'users'"
          [class]="activeSlice() === 'users'
            ? 'px-3 py-1.5 text-xs font-bold rounded-lg bg-surface text-bhagwa shadow-xs border border-app transition-all flex items-center gap-1.5 cursor-pointer'
            : 'px-3 py-1.5 text-xs font-medium rounded-lg text-secondary hover:text-main hover:bg-surface/60 transition-all flex items-center gap-1.5 cursor-pointer'"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <span>Users</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-subtle border border-app text-muted font-mono leading-none">
            {{ usersCount() }}
          </span>
        </button>

        <!-- Roles Tab -->
        <button
          type="button"
          id="tab-slice-roles"
          (click)="activeSlice.set('roles')"
          role="tab"
          [attr.aria-selected]="activeSlice() === 'roles'"
          [class]="activeSlice() === 'roles'
            ? 'px-3 py-1.5 text-xs font-bold rounded-lg bg-surface text-bhagwa shadow-xs border border-app transition-all flex items-center gap-1.5 cursor-pointer'
            : 'px-3 py-1.5 text-xs font-medium rounded-lg text-secondary hover:text-main hover:bg-surface/60 transition-all flex items-center gap-1.5 cursor-pointer'"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
          <span>Roles</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-subtle border border-app text-muted font-mono leading-none">
            {{ rolesCount() }}
          </span>
        </button>

        <!-- Permissions Tab -->
        <button
          type="button"
          id="tab-slice-permissions"
          (click)="activeSlice.set('permissions')"
          role="tab"
          [attr.aria-selected]="activeSlice() === 'permissions'"
          [class]="activeSlice() === 'permissions'
            ? 'px-3 py-1.5 text-xs font-bold rounded-lg bg-surface text-bhagwa shadow-xs border border-app transition-all flex items-center gap-1.5 cursor-pointer'
            : 'px-3 py-1.5 text-xs font-medium rounded-lg text-secondary hover:text-main hover:bg-surface/60 transition-all flex items-center gap-1.5 cursor-pointer'"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
          </svg>
          <span>Permissions</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-subtle border border-app text-muted font-mono leading-none">
            {{ permissionsCount() }}
          </span>
        </button>

        <!-- Organisations Tab -->
        <button
          type="button"
          id="tab-slice-organizations"
          (click)="activeSlice.set('organizations')"
          role="tab"
          [attr.aria-selected]="activeSlice() === 'organizations'"
          [class]="activeSlice() === 'organizations'
            ? 'px-3 py-1.5 text-xs font-bold rounded-lg bg-surface text-bhagwa shadow-xs border border-app transition-all flex items-center gap-1.5 cursor-pointer'
            : 'px-3 py-1.5 text-xs font-medium rounded-lg text-secondary hover:text-main hover:bg-surface/60 transition-all flex items-center gap-1.5 cursor-pointer'"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
          <span>Organisations</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-subtle border border-app text-muted font-mono leading-none">
            {{ orgsCount() }}
          </span>
        </button>
      </div>

      <!-- Filters & Actions Toolbar -->
      <div class="flex flex-wrap items-center gap-2">
        <!-- Search Input -->
        <div class="relative min-w-[210px] flex-1 sm:flex-none">
          <input
            type="text"
            id="admin-search-input"
            [placeholder]="searchPlaceholder()"
            [value]="searchQuery()"
            (input)="onSearchChange($event)"
            class="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl bg-surface border border-app text-main placeholder-muted focus:outline-none focus:border-bhagwa-500 focus:ring-1 focus:ring-bhagwa-500/30 transition-all shadow-2xs"
          />
          <svg class="w-3.5 h-3.5 text-muted absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>

        <!-- Users Status Filter -->
        @if (activeSlice() === 'users') {
          <select
            [value]="userStatusFilter()"
            (change)="onUserStatusChange($event)"
            class="px-2.5 py-1.5 text-xs rounded-xl bg-surface border border-app text-secondary focus:outline-none focus:border-bhagwa-500 shadow-2xs cursor-pointer"
          >
            <option value="ALL">All Statuses</option>
            <option value="ACTIVE">Active</option>
            <option value="SUSPENDED">Suspended</option>
            <option value="PENDING">Pending</option>
          </select>
        }

        <!-- Roles Type Filter -->
        @if (activeSlice() === 'roles') {
          <select
            [value]="roleTypeFilter()"
            (change)="onRoleTypeChange($event)"
            class="px-2.5 py-1.5 text-xs rounded-xl bg-surface border border-app text-secondary focus:outline-none focus:border-bhagwa-500 shadow-2xs cursor-pointer"
          >
            <option value="ALL">All Roles</option>
            <option value="SYSTEM">System Roles</option>
            <option value="CUSTOM">Custom Roles</option>
          </select>
        }

        <!-- Permissions Resource Filter -->
        @if (activeSlice() === 'permissions') {
          <select
            [value]="permissionResourceFilter()"
            (change)="onPermissionResourceChange($event)"
            class="px-2.5 py-1.5 text-xs rounded-xl bg-surface border border-app text-secondary focus:outline-none focus:border-bhagwa-500 shadow-2xs cursor-pointer"
          >
            <option value="ALL">All Resources</option>
            @for (res of uniqueResources(); track res) {
              <option [value]="res">{{ res }}</option>
            }
          </select>
        }

        <!-- Refresh Button -->
        <button
          type="button"
          (click)="refresh.emit()"
          [disabled]="isLoading()"
          title="Refresh Data"
          class="p-1.5 rounded-xl bg-surface border border-app text-secondary hover:text-main hover:bg-subtle transition-all shadow-2xs cursor-pointer disabled:opacity-50"
        >
          <svg class="w-3.5 h-3.5" [class.animate-spin]="isLoading()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>

        <!-- Primary Action CTA Button -->
        @if (createButtonLabel()) {
          <button
            type="button"
            (click)="createAction.emit()"
            class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-bhagwa-600 hover:bg-bhagwa-700 text-white shadow-xs transition-all flex items-center gap-1.5 cursor-pointer"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span>{{ createButtonLabel() }}</span>
          </button>
        }
      </div>
    </div>
  }

  <!-- Feedback Toast / Alerts -->
  @if (feedbackMessage()) {
    <div class="mb-3 px-3.5 py-2 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-xs flex items-center justify-between animate-fade-in">
      <div class="flex items-center gap-2">
        <span>✓</span>
        <span>{{ feedbackMessage() }}</span>
      </div>
      <button type="button" (click)="dismissAlert.emit('feedback')" class="text-emerald-600/70 hover:text-emerald-600 cursor-pointer">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }

  @if (errorMessage()) {
    <div class="mb-3 px-3.5 py-2 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-600 dark:text-rose-400 text-xs flex items-center justify-between animate-fade-in">
      <div class="flex items-center gap-2">
        <span>✕</span>
        <span>{{ errorMessage() }}</span>
      </div>
      <button type="button" (click)="dismissAlert.emit('error')" class="text-rose-600/70 hover:text-rose-600 cursor-pointer">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }

  <!-- Main Content Slot -->
  <ng-content></ng-content>
</div>
