spring.config.import=optional:file:.env[.properties]

spring.application.name=${APPLICATION_NAME}
spring.datasource.url=jdbc:${DB_CONNECTION}://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.${DB_CONNECTION}.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
security.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

spring.jackson.time-zone=UTC

security.execution.allow-local-development=${API_EXECUTION_ALLOW_LOCAL_DEVELOPMENT:true}
security.scripting.max-execution-time-ms=${SCRIPT_MAX_EXECUTION_TIME_MS:1000}

security.ai.gemini.api-key=${GEMINI_API_KEY:}
security.ai.gemini.model=${GEMINI_MODEL:gemini-flash-latest}

security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# SMTP Mail Configurations
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
app.mail.from=${MAIL_FROM:no-reply@apiaura.com}
app.mail.enabled=${MAIL_ENABLED:true}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# Default Admin Security Configurations
security.admin.email=${ADMIN_EMAIL}
security.admin.password=${ADMIN_PASSWORD}
security.admin.name=${ADMIN_NAME:System Admin}
security.admin.role-code=${ADMIN_ROLE_CODE:ADMIN}
security.admin.role-name=${ADMIN_ROLE_NAME:Administrator}

# Production Logging Configurations
logging.file.path=${LOG_PATH:logs}
logging.level.root=INFO
logging.level.com.apiaura.apiaura=INFO
logging.logback.rollingpolicy.max-file-size=${LOG_FILE_MAX_SIZE:10MB}
logging.logback.rollingpolicy.max-history=${LOG_FILE_MAX_HISTORY:30}
logging.logback.rollingpolicy.total-size-cap=${LOG_FILE_TOTAL_SIZE_CAP:3GB}